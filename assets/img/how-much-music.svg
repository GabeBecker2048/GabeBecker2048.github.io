<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="1280" height="800" font-family="DejaVu Serif, Georgia, 'Times New Roman', serif">
  <rect width="640" height="400" fill="#14171b"/>

  <!-- one measure of 4/4 -->
  <g stroke="#9aa4b0" stroke-width="1.2" fill="none">
    <path d="M70 48H570M70 60H570M70 72H570M70 84H570M70 96H570"/>
    <path d="M70 48V96M563 48V96"/>
    <path d="M569 48V96" stroke-width="4"/>
  </g>
  <g fill="#e4e7eb" font-weight="bold" font-size="27" text-anchor="middle">
    <text x="96" y="71">4</text><text x="96" y="95">4</text>
  </g>
  <g fill="#e4e7eb" stroke="#e4e7eb" stroke-width="1.6">
    <g transform="translate(170 90)"><ellipse rx="7.2" ry="5.2" transform="rotate(-22)"/><path d="M6.6 -2V-38"/></g>
    <g transform="translate(275 78)"><ellipse rx="7.2" ry="5.2" transform="rotate(-22)"/><path d="M6.6 -2V-38"/></g>
    <g transform="translate(380 66)"><ellipse rx="7.2" ry="5.2" transform="rotate(-22)"/><path d="M-6.6 2V38"/></g>
    <g transform="translate(485 84)"><ellipse rx="7.2" ry="5.2" transform="rotate(-22)"/><path d="M6.6 -2V-38"/></g>
  </g>

  <!-- the recurrence. Math italics are Unicode letters, so each line is one plain string. -->
  <g fill="#e4e7eb" font-family="DejaVu Math TeX Gyre, 'Cambria Math', 'STIX Two Math', serif">
    <text x="320" y="160" font-size="25" text-anchor="middle">𝑓(0) = 1</text>
    <text x="298" y="224" font-size="38" text-anchor="end">𝑓(𝑡) = 𝑝 ·</text>
    <text x="332" y="229" font-size="50" text-anchor="middle">Σ</text>
    <text x="332" y="254" font-size="14" text-anchor="middle" fill="#9aa4b0">𝑑 ∈ 𝐷, 𝑑 ≤ 𝑡</text>
    <text x="366" y="224" font-size="38">𝑓(𝑡 − 𝑑)</text>
  </g>

  <!-- the answer -->
  <path d="M70 278H570" stroke="#2b3138" stroke-width="1.2"/>
  <text x="320" y="307" text-anchor="middle" font-size="18" fill="#9aa4b0" font-family="DejaVu Math TeX Gyre, 'Cambria Math', 'STIX Two Math', serif">𝑓(32) =</text>
  <text x="320" y="338" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, Menlo, monospace" font-size="18.5" fill="#6fcf97">207,500,798,751,709,995,948,691,861,325,549,855</text>
  <text x="320" y="370" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13.5" fill="#9aa4b0">ways to write one measure of 4/4 on a piano</text>
</svg>
