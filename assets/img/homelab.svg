<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="1280" height="800" font-family="DejaVu Sans, Verdana, 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa4b0"/></marker>
  </defs>
  <rect width="640" height="400" fill="#14171b"/>

  <!-- clients -->
  <rect x="18" y="128" width="96" height="64" rx="32" fill="none" stroke="#2b3138" stroke-width="1.5"/>
  <g fill="#9aa4b0" font-size="12.5" text-anchor="middle"><text x="66" y="156">home network</text><text x="66" y="173">and internet</text></g>
  <path d="M116 160H146" stroke="#9aa4b0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Raspberry Pi -->
  <rect x="150" y="34" width="168" height="252" rx="10" fill="#1b1f24" stroke="#6fcf97" stroke-width="1.5"/>
  <text x="166" y="64" fill="#e4e7eb" font-size="18" font-weight="bold">Raspberry Pi</text>
  <text x="166" y="83" fill="#9aa4b0" font-size="12.5">the front door</text>
  <g font-size="13">
    <g transform="translate(166 104)"><rect width="136" height="44" rx="6" fill="#20252b" stroke="#2b3138"/><text x="12" y="19" fill="#e4e7eb" font-weight="bold">Pi-hole</text><text x="12" y="35" fill="#9aa4b0" font-size="11.5">DNS and DHCP</text></g>
    <g transform="translate(166 158)"><rect width="136" height="44" rx="6" fill="#20252b" stroke="#2b3138"/><text x="12" y="19" fill="#e4e7eb" font-weight="bold">Caddy</text><text x="12" y="35" fill="#9aa4b0" font-size="11.5">HTTPS entry point</text></g>
    <g transform="translate(166 212)"><rect width="136" height="44" rx="6" fill="#20252b" stroke="#2b3138"/><text x="12" y="19" fill="#e4e7eb" font-weight="bold">fail2ban</text><text x="12" y="35" fill="#9aa4b0" font-size="11.5">bans abusive clients</text></g>
  </g>
  <path d="M320 160H348" stroke="#9aa4b0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Docker host -->
  <rect x="352" y="34" width="270" height="252" rx="10" fill="#1b1f24" stroke="#6fcf97" stroke-width="1.5"/>
  <text x="368" y="64" fill="#e4e7eb" font-size="18" font-weight="bold">Docker host</text>
  <text x="368" y="83" fill="#9aa4b0" font-size="12.5">one Compose stack per service</text>
  <g font-size="11.5" text-anchor="middle">
    <text x="368" y="113" fill="#9aa4b0" font-size="10.5" text-anchor="start">MEDIA AND GAMES</text>
    <g fill="#20252b" stroke="#2b3138"><rect x="368" y="120" width="76" height="26" rx="13"/><rect x="449" y="120" width="76" height="26" rx="13"/><rect x="530" y="120" width="76" height="26" rx="13"/></g>
    <g fill="#e4e7eb"><text x="406" y="137">Jellyfin</text><text x="487" y="137">Immich</text><text x="568" y="137">Minecraft</text></g>

    <text x="368" y="171" fill="#9aa4b0" font-size="10.5" text-anchor="start">MY PROJECTS, RUNNING LIVE</text>
    <g fill="#1a2b23" stroke="#6fcf97"><rect x="368" y="178" width="76" height="26" rx="13"/><rect x="449" y="178" width="76" height="26" rx="13"/><rect x="530" y="178" width="76" height="26" rx="13"/></g>
    <g fill="#6fcf97"><text x="406" y="195">Murmur</text><text x="487" y="195">anchorless</text><text x="568" y="195">chesssnake</text></g>

    <text x="368" y="229" fill="#9aa4b0" font-size="10.5" text-anchor="start">MONITORING AND ALERTS</text>
    <g fill="#20252b" stroke="#2b3138"><rect x="368" y="236" width="84" height="26" rx="13"/><rect x="457" y="236" width="96" height="26" rx="13"/><rect x="558" y="236" width="48" height="26" rx="13"/></g>
    <g fill="#e4e7eb"><text x="410" y="253">Prometheus</text><text x="505" y="253">Alertmanager</text><text x="582" y="253">ntfy</text></g>
  </g>

  <!-- config repo -->
  <g stroke="#9aa4b0" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M234 288V318" marker-end="url(#a)"/><path d="M487 288V318" marker-end="url(#a)"/>
  </g>
  <rect x="150" y="322" width="472" height="52" rx="10" fill="#1b1f24" stroke="#2b3138" stroke-width="1.5"/>
  <text x="166" y="345" fill="#e4e7eb" font-size="14" font-weight="bold">One git repository</text>
  <text x="166" y="363" fill="#9aa4b0" font-size="12">configs from both machines, collected and committed every night</text>
</svg>
