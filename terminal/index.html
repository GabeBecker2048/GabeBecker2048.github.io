<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fbfaf7; --fg:#2b2b2b; --dim:#77746c; --line:#dedad0; --panel:#f1efe9;
    --red:#b3261e; --green:#3f7d20; --yellow:#8a5a00; --blue:#1f5fbf; --magenta:#8a3ea8; --cyan:#0f7c86;
    --ident:#83d467; --bar:24px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#d7dae0; --dim:#858d9a; --line:#2c3038; --panel:#1d2026;
      --red:#e06c75; --green:#98c379; --yellow:#e5c07b; --blue:#61afef; --magenta:#c678dd; --cyan:#56b6c2; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:15px/1.6 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }
  ::selection { background:var(--blue); color:var(--bg); }

  #term { padding:14px 22px calc(var(--bar) + 72px); min-height:100vh; }
  .line { white-space:pre-wrap; word-break:break-word; }
  .txt { max-width:100ch; white-space:pre-wrap; }
  .blk { margin-bottom:22px; }
  .o { margin-top:4px; }
  .dim { color:var(--dim); } .r { color:var(--red); } .g { color:var(--green); } .y { color:var(--yellow); }
  .b { color:var(--blue); } .m { color:var(--magenta); } .c { color:var(--cyan); } .bold { font-weight:700; }
  .ps1 .u { color:var(--green); font-weight:700; } .ps1 .p { color:var(--blue); font-weight:700; }
  .pending { display:none; }
  .lastlogin { display:flex; justify-content:space-between; gap:16px; color:var(--dim); margin-bottom:14px; }

  /* neofetch */
  .neo { display:flex; gap:4ch; align-items:flex-start; flex-wrap:wrap; }
  .art { display:grid; grid-template-columns:repeat(5, 2.4ch); grid-auto-rows:2.4ch; padding:2.4ch; background:#f0f0f0; border-radius:4px; }
  .art span.on { background:var(--ident); }
  .neo .k { color:var(--ident); font-weight:700; }
  .neo .title { font-weight:700; }
  .palette span { display:inline-block; width:3ch; height:1.1em; vertical-align:middle; }

  /* ls -l projects/ */
  .ls { display:grid; grid-template-columns:auto auto auto 1fr; column-gap:2ch; }
  .ls .name a { color:var(--blue); font-weight:700; }
  .ls .name a.ro { color:var(--cyan); }
  .ls .more { grid-column:4; margin-bottom:10px; }
  .ls .install::before { content:"$ "; color:var(--green); }
  .ls .install { color:var(--dim); }
  .ls .tags button { font:inherit; font-size:.9em; background:none; border:0; padding:0; margin-right:1.2ch; color:var(--dim); cursor:pointer; white-space:nowrap; }
  .ls .tags button:hover, .ls .tags button.on { color:var(--yellow); }

  /* inline grep + --tag picker on the ls command line */
  #q { font:inherit; color:var(--fg); background:transparent; border:0; border-bottom:1px dashed var(--dim); padding:0; width:18ch; outline:none; }
  #q:focus { border-bottom-color:var(--green); }
  #q::placeholder { color:var(--dim); }
  .tagpick { display:inline-block; position:relative; }
  .tagpick summary { list-style:none; cursor:pointer; color:var(--yellow); display:inline; }
  .tagpick summary::-webkit-details-marker { display:none; }
  .tagpick summary::before { content:"--tag="; color:var(--fg); }
  .tagpick summary::after { content:" ▾"; color:var(--dim); }
  .tp-n { display:none; }
  .tp-menu { position:absolute; left:0; top:calc(100% + 4px); z-index:5; background:var(--panel); border:1px solid var(--line); padding:4px 0; width:24ch; max-height:300px; overflow:auto; box-shadow:0 8px 28px rgba(0,0,0,.35); }
  .tp-menu label { display:flex; gap:1ch; align-items:center; padding:0 1ch; cursor:pointer; }
  .tp-menu label:hover { background:var(--bg); }
  .tp-menu input { accent-color:var(--green); }
  .tp-c { margin-left:auto; color:var(--dim); }

  /* experience: duckdb box table */
  .duck { white-space:pre; overflow-x:auto; line-height:1.2; } /* box-drawing glyphs are 1.2em tall: taller lines leave gaps */

  /* live prompt */
  #live { position:relative; }
  #cmd { position:absolute; inset:0; width:100%; opacity:0; font-size:16px; border:0; padding:0; background:transparent; color:transparent; }
  .cursor { background:var(--fg); color:var(--bg); animation:blink 1.1s steps(1) infinite; }
  .cursor.off { background:transparent; color:inherit; outline:1px solid var(--fg); outline-offset:-1px; animation:none; }
  @keyframes blink { 50% { background:transparent; color:inherit; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation:none; } html { scroll-behavior:auto; } }

  /* tmux status bar */
  #tmux { position:fixed; left:0; right:0; bottom:0; height:var(--bar); line-height:var(--bar); background:var(--green); color:var(--bg); font-size:13px; display:flex; justify-content:space-between; padding:0 6px; white-space:nowrap; overflow:hidden; z-index:10; }
  #tmux .sess { margin-right:1ch; }
  #tmux .sess.prefix { background:var(--yellow); }
  #tmux .win { cursor:pointer; padding:0 .6ch; }
  #tmux .win.cur { font-weight:700; }
  #tmux .win:hover { text-decoration:underline; }

  /* tappable commands for touch screens */
  #chips { scrollbar-width:none; position:fixed; left:0; right:0; bottom:var(--bar); display:none; gap:8px; padding:8px 12px; overflow-x:auto; background:var(--panel); border-top:1px solid var(--line); z-index:9; }
  #chips button { font:inherit; font-size:13px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:4px 10px; white-space:nowrap; }
  @media (pointer:coarse), (max-width:700px) { #chips { display:flex; } #term { padding-bottom:calc(var(--bar) + 120px); } }
  @media (max-width:700px) {
    body { font-size:13.5px; } #term { padding-left:12px; padding-right:12px; }
    .ls { grid-template-columns:auto 1fr; } .ls .perm, .ls .own { display:none; } .ls .more { grid-column:1 / -1; }
    #tmux .clock { display:none; }
  }
</style>
</head>
<body>
<noscript><p style="padding:20px">This page is an interactive terminal and needs JavaScript. The <a href="/">regular site</a> has everything.</p></noscript>

<div id="term">
  <div class="lastlogin"><span id="lastlogin"></span><a href="/">← regular site</a></div>

  <div class="blk pending" id="about" data-win="0" data-cmd="neofetch"><div class="line"><span class="ps"></span> <span class="cmdtext"></span></div><div class="o" id="o-neo"></div></div>
  <div class="blk pending" data-win="0" data-cmd="cat about.txt"><div class="line"><span class="ps"></span> <span class="cmdtext"></span></div><div class="o" id="o-about"></div></div>
  <div class="blk pending" id="projects" data-win="1" data-cmd="ls -l projects/ | grep -i ">
    <div class="line"><span class="ps"></span> <span class="cmdtext"></span><span class="lsctl pending"><input id="q" type="search" placeholder="type to filter" aria-label="Filter projects" autocomplete="off" spellcheck="false"> <span id="tags"></span></span></div>
    <div class="o" id="o-ls"></div>
  </div>
  <div class="blk pending" id="experience" data-win="2" data-cmd="duckdb -c &quot;FROM 'experience.csv' ORDER BY start DESC&quot;"><div class="line"><span class="ps"></span> <span class="cmdtext"></span></div><div class="o" id="o-xp"></div></div>
  <div class="blk pending" id="ai" data-win="3" data-cmd="cat ai-stance.md"><div class="line"><span class="ps"></span> <span class="cmdtext"></span></div><div class="o" id="o-ai"></div></div>

  <div id="out"></div>
  <div class="line pending" id="live"><span class="ps"></span> <span id="pre"></span><span class="cursor off" id="cur"> </span><span id="post"></span><input id="cmd" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
</div>

<div id="chips"></div>
<div id="tmux">
  <span><span class="sess">[gabe]</span><span id="wins"></span></span>
  <span class="clock" id="clock"></span>
</div>

<script src="/assets/projects.js"></script>
<script>
"use strict";
const PS1 = `<span class="ps1"><span class="u">gabe@gabebecker.com</span>:<span class="p">~</span>$</span>`;
document.querySelectorAll(".ps").forEach(el => (el.outerHTML = PS1));
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => (s || "").replace(/\s+/g, " ").trim();
const toBottom = () => scrollTo(0, document.documentElement.scrollHeight);
const RESUME = "/GabrielBecker_Resume.pdf";

// ---------- content, read from the real pages so it never drifts ----------
const docs = {};
setTimeout(() => { getDoc("/").catch(() => {}); getDoc("/ai/").catch(() => {}); }); // start both fetches right away
function getDoc(url) {
  return (docs[url] ||= fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => new DOMParser().parseFromString(t, "text/html")));
}
async function readHome() {
  const d = await getDoc("/");
  return {
    role: norm(d.querySelector(".profile .role")?.textContent),
    skills: [...d.querySelectorAll(".profile .skill")].map(s => norm(s.textContent)),
    about: norm(d.querySelector("#about .lead")?.textContent),
    now: norm(d.querySelector("#now")?.textContent),
    jobs: [...d.querySelectorAll("#experience .job")].map(j => ({
      start: norm(j.querySelector(".start")?.textContent),
      end: norm(j.querySelector(".end")?.textContent),
      role: norm(j.querySelector(".job-title")?.textContent),
      org: norm(j.querySelector(".org")?.textContent),
      summary: norm(j.querySelector("p")?.textContent),
    })),
  };
}
async function readAI() {
  const d = await getDoc("/ai/");
  const lines = [`<span class="m bold"># My stance on AI</span>`, `<span class="dim">${esc(norm(d.querySelector(".updated")?.textContent))}</span>`, ""];
  for (const el of d.querySelector("#ai-stance")?.children || []) {
    const t = esc(norm(el.textContent));
    if (/^H[1-6]$/.test(el.tagName)) lines.push(`<span class="m bold">## ${t}</span>`, "");
    else if (el.tagName === "UL" || el.tagName === "OL") { [...el.children].forEach((li, i) => lines.push(`${el.tagName === "OL" ? i + 1 + "." : "-"} ${esc(norm(li.textContent))}`)); lines.push(""); }
    else if (el.tagName === "BLOCKQUOTE") lines.push(`<span class="dim">&gt; ${t}</span>`, "");
    else lines.push(t, "");
  }
  return lines.join("\n").trim();
}
const failed = (file, href) => `<span class="r">cat: ${file}: could not read it.</span> Try the <a href="${href}">regular page</a>.`;

// ---------- renderers ----------
const IDENTICON = [".###.", ".#.#.", "..#..", ".....", ".#.#."]; // GabeBecker2048's GitHub avatar
async function neofetch() {
  let h; try { h = await readHome(); } catch { h = { role: "Data Engineer", skills: [] }; }
  const art = IDENTICON.join("").split("").map(c => `<span class="${c === "#" ? "on" : ""}"></span>`).join("");
  const active = PROJECTS.filter(p => p.status !== "archived").length;
  const row = (k, v) => `<div><span class="k">${k}</span>: ${v}</div>`;
  return `<div class="neo"><div class="art" aria-hidden="true">${art}</div><div>
    <div class="title"><span class="g">gabe</span>@<span class="g">gabebecker.com</span></div>
    <div class="dim">-------------------</div>
    ${row("Name", "Gabe Becker")}
    ${row("Role", esc(h.role))}
    ${row("Skills", esc(h.skills.slice(0, 7).join(", ")))}
    ${row("Projects", `${PROJECTS.length} (${active} active) · <a href="#" data-run="ls -l projects/">ls -l projects/</a>`)}
    ${row("Site", `<a href="/">gabebecker.com</a>`)}
    ${row("GitHub", `<a href="https://github.com/GabeBecker2048">GabeBecker2048</a>`)}
    ${row("Résumé", `<a href="${RESUME}">resume.pdf</a>`)}
    ${row("Shell", `type <a href="#" data-run="help">help</a>, or click any command`)}
    <div class="palette" style="margin-top:6px">${["dim", "red", "green", "yellow", "blue", "magenta", "cyan", "fg"].map(c => `<span style="background:var(--${c})"></span>`).join("")}</div>
  </div></div>`;
}
async function aboutTxt() {
  try { const h = await readHome(); return `<div class="txt">${esc(h.about)}\n\n<span class="y">${esc(h.now.split(":")[0])}:</span>${esc(h.now.slice(h.now.indexOf(":") + 1))}</div>`; }
  catch { return failed("about.txt", "/#about"); }
}
// experience.csv is built from the Experience section of the home page.
const XP_COLS = ["start", "end", "role", "org", "summary"];
const XP_QUERY = `duckdb -c "FROM 'experience.csv' ORDER BY start DESC"`;
const csvCell = v => (/[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v);
async function experienceCsv() {
  try {
    const h = await readHome();
    return `<div class="txt">${esc([XP_COLS.join(","), ...h.jobs.map(j => XP_COLS.map(c => csvCell(j[c] || "")).join(","))].join("\n"))}</div>`;
  } catch { return failed("experience.csv", "/#experience"); }
}
// Draws rows the way the DuckDB CLI does (duckbox): names, types, then values.
function duckbox(rows, cols, maxW = 44) {
  const cut = v => (v.length > maxW ? v.slice(0, maxW - 1) + "…" : v);
  const data = rows.map(r => cols.map(c => cut(r[c] || "")));
  const w = cols.map((c, i) => Math.max(c.length, "varchar".length, ...data.map(r => r[i].length)));
  const center = (s, n) => { const l = Math.floor((n - s.length) / 2); return " ".repeat(l) + s + " ".repeat(n - s.length - l); };
  const rule = (l, m, r) => `<span class="dim">${l + w.map(n => "─".repeat(n + 2)).join(m) + r}</span>`;
  const bar = `<span class="dim">│</span>`;
  const row = (cells, wrap) => bar + cells.map(c => " " + wrap(c) + " ").join(bar) + bar;
  return [
    rule("┌", "┬", "┐"),
    row(cols.map((c, i) => center(c, w[i])), s => `<span class="bold">${esc(s)}</span>`),
    row(cols.map((c, i) => center("varchar", w[i])), s => `<span class="dim">${esc(s)}</span>`),
    rule("├", "┼", "┤"),
    ...data.map(r => row(r.map((v, i) => v.padEnd(w[i])), esc)),
    rule("└", "┴", "┘"),
  ].join("\n");
}
async function experienceTable() {
  try {
    const h = await readHome();
    const jobs = [...h.jobs].sort((a, b) => b.start.localeCompare(a.start));
    return `<div class="duck">${duckbox(jobs, XP_COLS)}</div>
      <div class="dim" style="margin-top:6px">${jobs.length} rows · full text: ${run("cat experience.csv")} · full history: <a href="${RESUME}">resume.pdf</a></div>`;
  } catch { return failed("experience.csv", "/#experience"); }
}
async function aiTxt() {
  try { return `<div class="txt">${await readAI()}</div>`; } catch { return failed("ai-stance.md", "/ai/"); }
}
function lsRows(list, state) {
  return `<div class="dim">total ${list.length}</div><div class="ls">${list.map(p => {
    const perm = p.private ? "drwx------" : p.status === "archived" ? "dr-xr-xr-x" : "drwxr-xr-x";
    return `<span class="perm dim">${perm}</span><span class="own dim">gabe</span><span class="dim">${p.updated}</span>
      <span class="name"><a class="${p.status === "archived" ? "ro" : ""}" href="${p.page}">${esc(p.name)}/</a>${p.version ? ` <span class="dim">v${p.version}</span>` : ""}</span>
      <div class="more"><div class="txt">${esc(p.desc)}</div>
        ${p.install ? `<div class="install">${esc(p.install)}</div>` : ""}
        <div class="tags">${p.tags.map(t => `<button data-tag="${esc(t)}" class="${state?.tags.has(t) ? "on" : ""}">#${esc(t.toLowerCase())}</button>`).join("")}</div>
      </div>`;
  }).join("")}</div>`;
}

// ---------- the scripted session (with a short typing intro) ----------
let skip = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let seen = false; try { seen = sessionStorage.getItem("term-intro") === "1"; sessionStorage.setItem("term-intro", "1"); } catch {}
const animate = !reduce && !seen && !location.hash; // deep links (#projects) skip the intro

async function typeOut(el, text) {
  if (!animate || skip) { el.textContent = text; return; }
  for (const ch of text) { if (skip) { el.textContent = text; return; } el.textContent += ch; await sleep(12); }
}

const d = new Date();
$("lastlogin").textContent = `Last login: ${d.toDateString()} ${d.toTimeString().slice(0, 5)} on ttys000`;

let filter;
const RENDER = {
  "neofetch": async () => ($("o-neo").innerHTML = await neofetch()),
  "cat about.txt": async () => ($("o-about").innerHTML = await aboutTxt()),
  "ls -l projects/ | grep -i ": async () => {
    $("tags").innerHTML = "";
    filter = setupFilter({
      search: $("q"), tagsEl: $("tags"), label: "any",
      render(list, state) {
        $("tags").querySelector(".tp-label").textContent = state.tags.size ? [...state.tags].join(",").toLowerCase() : "any";
        $("o-ls").innerHTML = list.length ? lsRows(list, state) : `<span class="dim">(no matches)</span> <a href="#" data-clear>reset</a>`;
      },
    });
    document.querySelector(".lsctl").classList.remove("pending");
  },
  [XP_QUERY]: async () => ($("o-xp").innerHTML = await experienceTable()),
  "cat ai-stance.md": async () => ($("o-ai").innerHTML = await aiTxt()),
};

async function intro() {
  for (const blk of document.querySelectorAll(".blk")) {
    blk.classList.remove("pending");
    await typeOut(blk.querySelector(".cmdtext"), blk.dataset.cmd);
    await RENDER[blk.dataset.cmd]();
    if (animate && !skip) await sleep(40);
  }
  $("live").classList.remove("pending");
  renderPrompt();
  markWindow();
  if (/^#(about|projects|experience|ai)$/.test(location.hash)) gotoWin(WINDOWS.indexOf(location.hash.slice(1)), true);
}
["keydown", "pointerdown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => (skip = true), { once: true, passive: true }));

// ---------- the live prompt ----------
const cmd = $("cmd"), out = $("out");
const hist = []; let hIdx = 0;

function renderPrompt() {
  const v = cmd.value, i = cmd.selectionStart ?? v.length;
  $("pre").textContent = v.slice(0, i);
  $("cur").textContent = v[i] || " ";
  $("post").textContent = v.slice(i + 1);
  $("cur").classList.toggle("off", document.activeElement !== cmd);
}
["input", "keyup", "select", "focus", "blur", "click"].forEach(ev => cmd.addEventListener(ev, () => setTimeout(renderPrompt)));
cmd.addEventListener("input", toBottom);

// print: short text output (keeps spaces/newlines). block: rendered HTML (tables, neofetch), whitespace collapsed.
const emit = (html, cls) => { const div = document.createElement("div"); div.className = cls; div.innerHTML = html; out.appendChild(div); };
const print = html => emit(html, "o line");
const block = html => emit(html, "o");
const echo = line => { const div = document.createElement("div"); div.className = "line"; div.style.marginTop = "6px"; div.innerHTML = `${PS1} ${esc(line)}`; out.appendChild(div); };

const SLUGS = PROJECTS.map(p => p.slug);
const FILES = ["about.txt", "experience.csv", "ai-stance.md", "projects/"];
const PAGES = { home: "/", about: "/", projects: "/projects/", ai: "/ai/", github: "https://github.com/GabeBecker2048", resume: RESUME };
const clean = a => (a || "").replace(/^(\.\/|~\/)/, "").replace(/^projects\//, "");
const bySlug = a => PROJECTS.find(p => p.slug === clean(a).replace(/\/$/, ""));
const run = (s, label = s) => `<a href="#" data-run="${esc(s)}">${esc(label)}</a>`;

async function readme(p) {
  if (p.private) return `<span class="r">cat: ${p.slug}/README.md: Permission denied</span> <span class="dim">(private repository)</span> · ${run("open " + p.slug)}`;
  try {
    const r = await fetch(`https://raw.githubusercontent.com/GabeBecker2048/${p.slug}/main/README.md`);
    if (!r.ok) throw 0;
    const lines = (await r.text()).split("\n"), N = 40;
    return `<div class="txt">${esc(lines.slice(0, N).join("\n"))}</div>` +
      (lines.length > N ? `<div class="dim">-- ${lines.length - N} more lines. ${run("open " + p.slug)} for the full page --</div>` : "");
  } catch { return `<span class="r">cat: ${p.slug}/README.md: could not fetch it</span>`; }
}

const COMMANDS = {
  help: () => print(`<div class="txt">Commands (click one to run it):
  ${run("ls")} [-l] [projects/]       list files
  ${run("cat about.txt")}               print a file; try ${run("cat chesssnake/README.md")}
  ${run("open chesssnake")}             open a project, or: home, projects, ai, github, resume
  ${run(XP_QUERY, "duckdb")} -c "&lt;query&gt;"         query experience.csv
  grep &lt;text&gt;                 filter the project list
  tag &lt;name&gt;, ${run("tags")}           filter by tag, list tags
  ${run("whoami")}  ${run("resume")}  ${run("history")}  ${run("clear")}  ${run("exit")}

<span class="dim">Tab completes · ↑/↓ history · Ctrl+L clears · Ctrl+C cancels · Ctrl+B then 0-3 switches window</span></div>`),
  ls: async args => {
    const long = args.includes("-l"), target = args.filter(a => !a.startsWith("-"))[0];
    if (!target) return (long ? block : print)(long ? `<div class="ls" style="grid-template-columns:auto auto 1fr">${FILES.map(f => `<span class="dim">${f.endsWith("/") ? "drwxr-xr-x" : "-rw-r--r--"}</span><span class="dim">gabe</span>${f.endsWith("/") ? `<a class="bold" href="#" data-run="ls -l projects/">projects/</a>` : run("cat " + f, f)}`).join("")}</div>`
      : FILES.map(f => (f.endsWith("/") ? `<a class="bold" href="#" data-run="ls projects/">${f}</a>` : run("cat " + f, f))).join("  "));
    if (/^(\.\/|~\/)?projects\/?$/.test(target)) return (long ? block : print)(long ? lsRows(PROJECTS) : PROJECTS.map(p => `<a class="bold" href="${p.page}">${p.slug}/</a>`).join("  "));
    const p = bySlug(target);
    if (p) return print(p.private ? `<span class="r">ls: cannot open directory '${p.slug}/': Permission denied</span>` : run(`cat ${p.slug}/README.md`));
    print(`<span class="r">ls: cannot access '${esc(target)}': No such file or directory</span>`);
  },
  cat: async args => {
    const f = clean(args[0]);
    if (!f) return print(`<span class="dim">usage: cat &lt;file&gt;  (try ${run("ls")})</span>`);
    if (f === "about.txt") return block(await aboutTxt());
    if (f === "experience.csv") return block(await experienceCsv());
    if (f === "ai-stance.md") return block(await aiTxt());
    const m = f.match(/^([^/]+)\/README\.md$/i), p = m && bySlug(m[1]);
    if (p) return block(await readme(p));
    if (bySlug(f)) return print(`<span class="r">cat: ${esc(f)}: Is a directory</span> <span class="dim">try</span> ${run(`cat ${bySlug(f).slug}/README.md`)}`);
    print(`<span class="r">cat: ${esc(f)}: No such file or directory</span>`);
  },
  open: args => {
    const a = clean(args[0]).replace(/\/$/, "").toLowerCase(), p = bySlug(a), url = p ? p.page : PAGES[a];
    if (!url) return print(`<span class="r">open: ${esc(args[0] || "")}: not found</span> <span class="dim">(projects: ${SLUGS.join(", ")})</span>`);
    print(`<span class="dim">opening ${esc(url)} …</span>`); setTimeout(() => (location.href = url), 300);
  },
  grep: args => {
    $("q").value = args.join(" ").replace(/^-i\s*/, "").replace(/^["']|["']$/g, "");
    $("q").dispatchEvent(new Event("input"));
    print(`<span class="dim">filtered the project list above</span> · <a href="#" data-win="1">jump to it</a>`);
  },
  tag: args => {
    const t = allTags().find(x => x.tag.toLowerCase() === (args[0] || "").toLowerCase());
    if (!t) return print(`<span class="r">tag: ${esc(args[0] || "")}: unknown tag</span> (see ${run("tags")})`);
    filter.state.tags.add(t.tag); filter.update();
    print(`<span class="dim">filtered the project list by ${esc(t.tag)}</span> · <a href="#" data-win="1">jump to it</a>`);
  },
  tags: () => print(allTags().map(t => `<a href="#" data-run="tag ${esc(t.tag.toLowerCase())}">${esc(t.tag.toLowerCase())}</a><span class="dim">(${t.count})</span>`).join("  ")),
  whoami: async () => block(await neofetch()),
  duckdb: async args => {
    if (!/experience\.csv/i.test(args.join(" "))) return print(`<span class="r">Catalog Error:</span> the only table here is experience.csv. Try ${run(XP_QUERY)}`);
    block(await experienceTable());
  },
  resume: () => COMMANDS.open(["resume"]),
  history: () => print(hist.map((h, i) => `${String(i + 1).padStart(4)}  ${esc(h)}`).join("\n") || `<span class="dim">(empty)</span>`),
  clear: () => { out.innerHTML = ""; toBottom(); },
  pwd: () => print("/home/gabe"),
  echo: args => print(esc(args.join(" "))),
  date: () => print(esc(new Date().toString())),
  cd: () => print(`<span class="dim">this shell stays in ~. try ${run("open chesssnake")}</span>`),
  exit: () => { print("logout"); setTimeout(() => (location.href = "/"), 300); },
  sudo: async args => {
    if (args[0] !== "hire-me") return print(`gabe is not in the sudoers file. This incident will be reported.`);
    print(`[sudo] password for recruiter: ********`); await sleep(500);
    print(`<span class="g">access granted.</span> opening <a href="${RESUME}">resume.pdf</a> …`); setTimeout(() => (location.href = RESUME), 900);
  },
};

async function execute(line) {
  line = line.trim();
  echo(line);
  if (line) { hist.push(line); }
  hIdx = hist.length;
  if (!line) return toBottom();
  const [name, ...args] = line.split(/\s+/);
  const fn = COMMANDS[name];
  if (fn) await fn(args); else print(`<span class="r">bash: ${esc(name)}: command not found</span> <span class="dim">(try ${run("help")})</span>`);
  toBottom();
}

function complete() {
  const v = cmd.value, words = v.split(/\s+/), last = words[words.length - 1];
  let pool;
  if (words.length === 1) pool = Object.keys(COMMANDS).filter(c => c !== "sudo");
  else if (words[0] === "open") pool = [...SLUGS, ...Object.keys(PAGES)];
  else if (words[0] === "tag") pool = allTags().map(t => t.tag.toLowerCase());
  else pool = [...FILES, ...SLUGS.map(s => s + "/"), ...SLUGS.map(s => s + "/README.md")];
  const hits = pool.filter(c => c.startsWith(last));
  if (!hits.length) return;
  let common = hits[0];
  for (const h of hits) while (!h.startsWith(common)) common = common.slice(0, -1);
  if (hits.length > 1 && common === last) { echo(v); print(hits.join("  ")); toBottom(); return; }
  words[words.length - 1] = common + (hits.length === 1 && !common.endsWith("/") ? " " : "");
  cmd.value = words.join(" ");
}

cmd.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); const v = cmd.value; cmd.value = ""; execute(v).then(renderPrompt); }
  else if (e.key === "Tab") { e.preventDefault(); complete(); }
  else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    hIdx = Math.max(0, Math.min(hist.length, hIdx + (e.key === "ArrowUp" ? -1 : 1)));
    cmd.value = hist[hIdx] ?? "";
    cmd.setSelectionRange(cmd.value.length, cmd.value.length);
  }
  else if (e.ctrlKey && e.key.toLowerCase() === "l") { e.preventDefault(); COMMANDS.clear(); }
  else if (e.ctrlKey && e.key.toLowerCase() === "c" && !getSelection().toString()) { e.preventDefault(); echo(cmd.value + "^C"); cmd.value = ""; }
  else if (e.ctrlKey && e.key.toLowerCase() === "u") { e.preventDefault(); cmd.value = ""; }
  setTimeout(renderPrompt);
});

// Typing anywhere goes to the prompt. Clicking empty space focuses it without scrolling.
document.addEventListener("keydown", e => {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || $("live").classList.contains("pending")) return;
  cmd.focus({ preventScroll: true }); toBottom();
});
$("term").addEventListener("click", e => {
  if (e.target.closest("a, button, input, details, .tp-menu") || getSelection().toString()) return;
  if (matchMedia("(pointer: coarse)").matches) return; // on phones only the prompt line itself opens the keyboard
  cmd.focus({ preventScroll: true }); renderPrompt();
});

// Clickable commands (help output, neofetch, chips).
document.addEventListener("click", e => {
  const r = e.target.closest("[data-run]");
  if (r) { e.preventDefault(); execute(r.dataset.run).then(renderPrompt); }
});

// ---------- tmux status bar: windows follow the scroll position ----------
const WINDOWS = ["about", "projects", "experience", "ai"];
let curWin = 0, lastWin = null;
$("wins").innerHTML = WINDOWS.map((w, i) => `<span class="win" data-win="${i}">${i}:${w}</span>`).join("");
function firstBlock(i) { return document.querySelector(`.blk[data-win="${i}"]`); }
function gotoWin(i, instant) { firstBlock(i)?.scrollIntoView({ behavior: reduce || instant ? "instant" : "smooth", block: "start" }); }
function markWindow() {
  let cur = 0;
  WINDOWS.forEach((_, i) => { const b = firstBlock(i); if (b && b.getBoundingClientRect().top < innerHeight * 0.4) cur = i; });
  if (cur !== curWin) { lastWin = curWin; curWin = cur; }
  document.querySelectorAll("#wins .win").forEach((el, i) => {
    el.classList.toggle("cur", i === curWin);
    el.textContent = `${i}:${WINDOWS[i]}${i === curWin ? "*" : i === lastWin ? "-" : ""}`;
  });
}
addEventListener("scroll", markWindow, { passive: true });
document.addEventListener("click", e => {
  const w = e.target.closest("[data-win]:not(.blk)");
  if (w) { e.preventDefault(); gotoWin(+w.dataset.win); }
});
let prefix = false;
addEventListener("keydown", e => {
  if (e.ctrlKey && e.key.toLowerCase() === "b") { e.preventDefault(); prefix = true; document.querySelector("#tmux .sess").classList.add("prefix"); return; }
  if (prefix) {
    prefix = false; document.querySelector("#tmux .sess").classList.remove("prefix");
    if (/^[0-3]$/.test(e.key)) { e.preventDefault(); e.stopImmediatePropagation(); gotoWin(+e.key); }
  }
}, true);
function tick() {
  const n = new Date(), mon = n.toLocaleString("en", { month: "short" });
  $("clock").textContent = `"gabebecker.com" ${n.toTimeString().slice(0, 5)} ${String(n.getDate()).padStart(2, "0")}-${mon}-${String(n.getFullYear()).slice(2)}`;
}
tick(); setInterval(tick, 15000);

// ---------- touch screens: tappable commands ----------
$("chips").innerHTML = ["help", "ls -l projects/", "cat about.txt", "cat experience.csv", "cat ai-stance.md", "tags", "whoami", "exit"]
  .map(c => `<button data-run="${c}">${c}</button>`).join("");

intro();
loadLive().then(changed => changed && filter?.update()); // live versions from PyPI/GitHub
</script>
