<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Gabe Becker</title>
<meta name="description" content="Open-source projects by Gabe Becker, with install guides and docs.">
<link rel="canonical" href="https://gabebecker.com/projects/">
<meta property="og:type" content="website">
<meta property="og:title" content="Projects · Gabe Becker">
<meta property="og:description" content="Open-source projects by Gabe Becker, with install guides and docs.">
<meta property="og:url" content="https://gabebecker.com/projects/">
<meta property="og:image" content="https://avatars.githubusercontent.com/u/78775796?v=4">
<meta name="twitter:card" content="summary">
<link rel="icon" href="https://avatars.githubusercontent.com/u/78775796?v=4">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header data-topbar="projects"></header>
<main class="wrap">
  <h1 class="page-h">Projects</h1>
  <p class="lede">Things I build and maintain. Each project has an overview page here, with links to its docs, source, and where to report bugs.</p>
  <div class="sticky">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search projects  ( / )" aria-label="Search projects">
      <div id="tags"></div>
      <label class="sortpick"><span>Sort by</span>
        <select id="sort" aria-label="Sort projects">
          <option value="recommended">Recommended</option>
          <option value="maintained">Actively maintained first</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A–Z</option>
        </select>
      </label>
    </div>
    <div class="status"><span id="count"></span><span class="active" id="active"></span></div>
  </div>
  <div id="list"><noscript><p>This list needs JavaScript. All projects are also on <a href="https://github.com/GabeBecker2048">GitHub</a>.</p></noscript></div>
</main>
<footer data-foot></footer>

<script src="/assets/layout.js"></script>
<script src="/assets/projects.js"></script>
<script>
const filter = setupFilter({
  search: document.getElementById("q"),
  tagsEl: document.getElementById("tags"),
  activeEl: document.getElementById("active"),
  sortEl: document.getElementById("sort"),
  label: "Filter by tag",
  render(list, state) {
    document.getElementById("count").textContent = `${list.length} of ${PROJECTS.length} projects`;
    document.getElementById("list").innerHTML = list.length
      ? list.map(p => projectRow(p, { state })).join("")
      : `<div class="empty">No projects match. <a href="#" data-clear>Clear search and filters</a></div>`;
  },
});
loadLive().then(changed => changed && filter.update()); // live versions from PyPI/GitHub
enableRowClicks();
</script>
</body>
</html>
